databaseChangeLog:
  - changeSet:
      id: create-tables
      author: Nikita Gusev
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: texts
      changes:
        - createTable:
            tableName: texts
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: language
                  type: varchar(3)
                  constraints:
                    nullable: false