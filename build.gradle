plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'ru.bysenla'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("org.springframework.boot:spring-boot-starter-test:3.5.16")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    implementation("org.springframework.boot:spring-boot-starter-web:3.5.16")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:3.5.16")
    implementation("org.springframework.boot:spring-boot-starter-validation:3.5.16")
    implementation("org.postgresql:postgresql:42.7.13")
    implementation("org.liquibase:liquibase-core:4.33.0")
    testImplementation("org.springframework.boot:spring-boot-testcontainers:3.5.16")
    testImplementation("org.testcontainers:junit-jupiter:1.21.4")
    testImplementation("org.testcontainers:postgresql:1.21.4")
    testImplementation("org.awaitility:awaitility:4.2.2")
}

test {
    useJUnitPlatform()
}